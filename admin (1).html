<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Admin – Little Things That Count</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; background: #FFFFFF; color: #1B1D2A; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .boot { min-height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px 16px; text-align: center; }
  .kicker { font-size: 13px; font-weight: 700; letter-spacing: .1em; color: #C8001F; }
  h1 { margin: 0; font-size: 28px; line-height: 1.2; color: #1A31B7; }
  .spin { width: 28px; height: 28px; border: 4px solid #D5D9EC; border-top-color: #1A31B7; border-radius: 50%; animation: s .9s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
  p { margin: 0; max-width: 460px; font-size: 15px; line-height: 1.55; color: #474B5E; }
  .err { color: #B0001E; font-weight: 700; }
  .btn { display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border-radius: 999px; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
  .btn.red { background: #C8001F; color: #FFFFFF; border: 0; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  #gbtn { min-height: 44px; display: flex; justify-content: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="boot">
  <span class="kicker">LITTLE THINGS THAT COUNT</span>
  <h1 id="ttl">Admin</h1>
  <div class="spin" id="spin" aria-hidden="true"></div>
  <p id="msg" role="status">Loading the Admin page…</p>
  <p id="err" class="err" role="alert" hidden></p>
  <div id="gbtn" hidden></div>
  <div class="row" id="acts" hidden>
    <button type="button" class="btn red" id="again">Try again</button>
  </div>
</main>
<script>
/* Little Things That Count – Admin page on GitHub Pages.
   This file only loads the Admin page from the contest's Google Apps Script after "Sign in with Google", so it never needs
   changing when the web app is updated. Who can open it is still decided by tab Admin Users (Active = Yes). */
(function () {
  var API = 'https://script.google.com/macros/s/AKfycbzUQdgXOqpr7VV7OptYDXPI9HDWhbY5LjhHwBymt4TXtod6JIob1Y0L7rgGo9yx5TjmgA/exec';
  var KEY = 'lttc_admin_auth';   // sign-in token for this browser (30 days); Sign out in the Admin page removes it
  var $ = function (id) { return document.getElementById(id); };
  var msg = $('msg'), err = $('err'), spin = $('spin'), acts = $('acts'), gbtn = $('gbtn');
  $('again').onclick = function () { load(); };
  function store(fn) { try { return fn(window.localStorage); } catch (e) { return null; } }
  function token() { return store(function (ls) { var t = JSON.parse(ls.getItem(KEY) || 'null'); return t && t.exp > Date.now() ? t.token : ''; }) || ''; }
  function params() { var q = {}; new URLSearchParams(location.search).forEach(function (v, k) { q[k] = v; }); return q; }
  function post(fn, args, auth) {
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args, auth: auth || undefined }) })
      .then(function (r) { return r.json(); });
  }
  function state(o) {
    spin.hidden = !o.busy; msg.textContent = o.msg || ''; msg.hidden = !o.msg;
    err.textContent = o.err || ''; err.hidden = !o.err; acts.hidden = !o.retry; gbtn.hidden = !o.google;
    $('ttl').textContent = o.title || 'Admin';
  }
  function fail(why) { state({ err: 'The Admin page could not load' + (why ? ' (' + String(why).slice(0, 160) + ')' : '') + '. Check your connection and try again.', retry: true }); }
  function load() {
    state({ busy: true, msg: 'Loading the Admin page…' });
    var slow = setTimeout(function () { msg.textContent = 'Still loading – this can take a few seconds…'; }, 6000);
    post('adminGh', [params(), location.origin + location.pathname], token()).then(function (d) {
      clearTimeout(slow);
      if (!d || !d.ok) return fail(d && d.error);
      var r = d.r || {};
      if (r.signin) { if (r.email || token()) store(function (ls) { ls.removeItem(KEY); }); return signin(r); }
      document.open(); document.write(r.html); document.close();
    }).catch(function (e) { clearTimeout(slow); fail(e && e.message); });
  }
  var gsiReady = null, clientId = '';
  function gsi() {
    return gsiReady || (gsiReady = new Promise(function (ok, no) {
      var s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
      s.onload = function () { ok(); }; s.onerror = function () { gsiReady = null; no(new Error('Google sign-in did not load')); };
      document.head.appendChild(s);
    }));
  }
  function signin(r) {
    clientId = r.gsiClientId || clientId;
    state({ title: 'Organizing Committee', msg: 'Sign in with your @vus-etsc.edu.vn account to open the Admin page.', err: r.message || '', busy: true });
    gsi().then(function () {
      google.accounts.id.initialize({ client_id: clientId, callback: onCred, auto_select: false, cancel_on_tap_outside: true });
      gbtn.innerHTML = '';
      google.accounts.id.renderButton(gbtn, { type: 'standard', theme: 'outline', size: 'large', text: 'signin_with', shape: 'pill', logo_alignment: 'left' });
      spin.hidden = true; gbtn.hidden = false;
    }, function (e) { fail(e.message); });
  }
  function onCred(c) {
    state({ title: 'Organizing Committee', busy: true, msg: 'Checking your account…' });
    post('gsiSignin', [c && c.credential]).then(function (d) {
      var r = (d && d.r) || {};
      if (!d || !d.ok) return fail(d && d.error);
      if (!r.ok) return signin({ message: r.notVus ? r.email + ' is not a VUS account. Choose your @vus-etsc.edu.vn account.' : (r.message || 'Please try again.') });
      store(function (ls) { ls.setItem(KEY, JSON.stringify({ token: r.token, exp: r.exp })); });
      load();
    }).catch(function (e) { fail(e && e.message); });
  }
  load();
})();
</script>
</body>
</html>
